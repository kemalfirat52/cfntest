<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera ile Kart Okuyucu (OCR)</title>
    <!-- Tarayıcı tabanlı OCR kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 20px; color: #1a1a1a; }
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 10;
            margin-bottom: 12px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Kart hizalama çerçevesi */
        .guide-box {
            position: absolute;
            top: 10%;
            left: 8%;
            width: 84%;
            height: 80%;
            border: 2px dashed #00ff88;
            border-radius: 10px;
            box-sizing: border-box;
            pointer-events: none;
        }
        button {
            background-color: #0066ff;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        button:disabled { background-color: #99c2ff; }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            background: #eef2f6;
            color: #333;
        }
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 14px;
            border: 2px solid #0066ff;
            border-radius: 12px;
            background: #f0f7ff;
            text-align: left;
        }
        .result-box div { margin-bottom: 8px; font-size: 14px; }
        .result-box strong { color: #004ecc; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kamera ile Kart Bilgisi Okuma</h2>
    <p style="font-size: 13px; color: #666;">Kartı yeşil çerçeve içine hizalayın ve tarama butonuna basın.</p>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline></video>
        <div class="guide-box"></div>
    </div>

    <button id="startCamBtn">1. Kamerayı Aç</button>
    <button id="scanBtn" disabled>2. Kart Bilgilerini Tara</button>

    <div id="status" class="status">Durum: Kamera bekleniyor...</div>

    <div id="resultBox" class="result-box">
        <div><strong>Kart Numarası:</strong> <span id="cardNumber">-</span></div>
        <div><strong>Son Kullanma (SKT):</strong> <span id="expiryDate">-</span></div>
        <div><strong>Ham Okunan Metin:</strong> <pre id="rawText" style="white-space: pre-wrap; font-size: 11px; background:#fff; padding:6px; border-radius:6px;">-</pre></div>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startCamBtn = document.getElementById('startCamBtn');
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    // Arka kamerayı başlatma
    startCamBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            startCamBtn.style.display = "none";
            scanBtn.disabled = false;
            statusDiv.innerText = "Kamera hazır. Kartı çerçeveye tutup 'Tara' butonuna basın.";
        } catch (err) {
            statusDiv.innerText = "Kamera izni verilmedi veya HTTPS kullanılmıyor: " + err.message;
        }
    });

    // Görüntüyü yakalayıp OCR ile okuma
    scanBtn.addEventListener('click', async () => {
        scanBtn.disabled = true;
        statusDiv.innerText = "Görüntü işleniyor ve yazılar okunuyor (3-5 saniye sürebilir)...";

        // Video karesini canvas'a çiz
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        try {
            const result = await Tesseract.recognize(canvas, 'eng', {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        statusDiv.innerText = `Okunuyor: %${Math.round(m.progress * 100)}`;
                    }
                }
            });

            const text = result.data.text;
            
            // 16 haneli kart numarasını yakalama (4'lü gruplar halinde veya bitişik)
            const cardMatch = text.match(/(?:\d{4}[\s-]?){3}\d{4}/);
            // Son kullanma tarihini yakalama (AA/YY formatı)
            const dateMatch = text.match(/(0[1-9]|1[0-2])\/([2-9][0-9])/);

            resultBox.style.display = "block";
            document.getElementById('cardNumber').innerText = cardMatch ? cardMatch[0] : "Net okunamadı (Işığı ayarlayıp tekrar deneyin)";
            document.getElementById('expiryDate').innerText = dateMatch ? dateMatch[0] : "Bulunamadı";
            document.getElementById('rawText').innerText = text.trim() || "Metin algılanamadı";

            statusDiv.innerText = "Tarama tamamlandı!";
        } catch (error) {
            statusDiv.innerText = "OCR Hatası: " + error.message;
        } finally {
            scanBtn.disabled = false;
        }
    });
</script>

</body>
</html>
